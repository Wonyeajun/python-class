<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
</head>
<body>
    <h2>로그인 페이지</h2>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <p>
            <input type="text" name="username" placeholder="아이디를 입력하세요" required>
        </p>
        <p>
            <input type="password" name="password" placeholder="비밀번호를 입력하세요" required>
        </p>
        <button type="submit">로그인</button>
    </form>

    <br>
    <p>아직 회원이 아니신가요?</p>
    <a href="/account/signup/">최소한의 안전장치를 위해 회원가입하러 가기</a>
</body>
</html>
