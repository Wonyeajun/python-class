{% if error %}
    <p style="color: red;">{{ error }}</p>
{% endif %}

<h2>회원가입</h2>

<p>
    가입하면 랜덤 닉네임(예: <strong>피곤한 하이에나</strong>)이 자동으로 부여됩니다.
</p>

<form method="POST">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">가입하기</button>
</form>

<br>

<a href="{% url 'login' %}">
    이미 계정이 있으신가요? 로그인하기
</a>
